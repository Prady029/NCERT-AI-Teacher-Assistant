[project]
name = "ncert-ai-teacher-assistant"
version = "0.1.0"
description = "FastAPI prototype for NCERT-aligned teacher planning and assessment drafts"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "google-generativeai>=0.5,<1.0",
    "openai>=1.12,<2.0",
    "anthropic>=0.25,<1.0",
    "requests>=2.31,<3.0",
    "pypdf>=4.0,<7.0",
    "qdrant-client>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "ruff>=0.5,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
